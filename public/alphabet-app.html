<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alphabet</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #f093fb 25%, #f5576c 50%, #fda085 75%, #4facfe 100%);
    background-size: 400% 400%;
    animation: bgShift 8s ease infinite;
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 30px;
    overflow-x: hidden;
    position: relative;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ---- FLOATING SHAPES ---- */
  .shapes-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .shape {
    position: absolute;
    opacity: 0.75;
    animation: floatUp linear infinite;
    font-size: 1.6rem;
    filter: drop-shadow(0 0 10px rgba(255,215,0,0.9)) drop-shadow(0 0 4px rgba(255,255,255,0.7));
  }

  @keyframes floatUp {
    0%   { transform: translateY(0px) rotate(0deg) scale(1); }
    30%  { transform: translateY(-28px) rotate(15deg) scale(1.07); }
    60%  { transform: translateY(14px) rotate(-10deg) scale(0.95); }
    100% { transform: translateY(0px) rotate(0deg) scale(1); }
  }

  /* ---- HEADER ---- */
  .header {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-bottom: 18px;
    animation: dropIn 0.7s cubic-bezier(.23,1.5,.5,1) both;
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-50px) scale(0.8); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.8rem, 10vw, 5.5rem);
    color: #fff;
    text-shadow:
      -2px -2px 0 rgba(0,0,0,0.55),
       2px -2px 0 rgba(0,0,0,0.55),
      -2px  2px 0 rgba(0,0,0,0.55),
       2px  2px 0 rgba(0,0,0,0.55),
       0 5px 0 rgba(0,0,0,0.25),
       0 10px 30px rgba(0,0,0,0.2);
    letter-spacing: 4px;
  }

  /* ---- NAV ---- */
  .nav {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 14px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    justify-content: center;
    animation: dropIn 0.7s 0.12s cubic-bezier(.23,1.5,.5,1) both;
  }

  .nav-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 2.3rem;
    padding: 18px 50px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    color: #fff;
    letter-spacing: 1.5px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.22), 0 0 16px rgba(255,255,255,0.25);
    text-shadow:
      -2px -2px 0 #000,
       2px -2px 0 #000,
      -2px  2px 0 #000,
       2px  2px 0 #000;
    transition: transform 0.18s, box-shadow 0.18s, filter 0.18s;
  }
  .nav-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 30px rgba(0,0,0,0.22); }
  .nav-btn:active { transform: scale(0.96); }
  .nav-btn.n1 { background: linear-gradient(135deg, #fdcb6e, #e17055); }
  .nav-btn.n2 { background: linear-gradient(135deg, #1dd1a1, #00b894); }
  .nav-btn.n3 { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
  .nav-btn.active {
    box-shadow: 0 0 0 4px #fff, 0 8px 24px rgba(0,0,0,0.25);
    transform: scale(1.09);
    filter: brightness(1.12);
  }

  /* ---- CARD ---- */
  .card {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(18px);
    border-radius: 32px;
    border: 2.5px solid rgba(255,255,255,0.45);
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    padding: 28px 20px 26px;
    width: 100%;
    max-width: 700px;
    animation: cardIn 0.5s cubic-bezier(.23,1.5,.5,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.88) translateY(30px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .mode-title {
    font-family: 'Fredoka One', cursive;
    font-size: 3.2rem;
    color: #fff;
    text-shadow:
      -2px -2px 0 #000,
       2px -2px 0 #000,
      -2px  2px 0 #000,
       2px  2px 0 #000;
    margin-bottom: 18px;
    text-align: center;
    letter-spacing: 1px;
  }

  /* ======== MODE 1 — BIG LETTERS ONLY ======== */
  #mode1 .alphabet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 10px;
    width: 100%;
  }

  #mode1 .letter-tile {
    background: rgba(255,255,255,0.93);
    border-radius: 20px;
    padding: 14px 6px 12px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.13);
    transition: transform 0.18s, box-shadow 0.18s;
    border: 3px solid transparent;
  }
  #mode1 .letter-tile:hover { transform: translateY(-6px) scale(1.1); box-shadow: 0 14px 32px rgba(0,0,0,0.2); }
  #mode1 .letter-tile:active { transform: scale(0.91); }

  #mode1 .big-letter {
    font-family: 'Fredoka One', cursive;
    font-size: 2.8rem;
    line-height: 1;
    display: block;
  }
  #mode1 .small-letter {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    display: block;
    margin-top: 3px;
    opacity: 0.6;
  }

  #mode1 .letter-tile:nth-child(6n+1) { border-color: #ff6b6b; }
  #mode1 .letter-tile:nth-child(6n+1) .big-letter { color: #ff6b6b; }
  #mode1 .letter-tile:nth-child(6n+2) { border-color: #feca57; }
  #mode1 .letter-tile:nth-child(6n+2) .big-letter { color: #c79100; }
  #mode1 .letter-tile:nth-child(6n+3) { border-color: #1dd1a1; }
  #mode1 .letter-tile:nth-child(6n+3) .big-letter { color: #00a67e; }
  #mode1 .letter-tile:nth-child(6n+4) { border-color: #54a0ff; }
  #mode1 .letter-tile:nth-child(6n+4) .big-letter { color: #0065db; }
  #mode1 .letter-tile:nth-child(6n+5) { border-color: #fd79a8; }
  #mode1 .letter-tile:nth-child(6n+5) .big-letter { color: #e6005a; }
  #mode1 .letter-tile:nth-child(6n+6) { border-color: #a29bfe; }
  #mode1 .letter-tile:nth-child(6n+6) .big-letter { color: #5c4dd1; }

  /* ======== MODE 2 — WITH WORDS ======== */
  #mode2 .flag-row {
    font-size: 3.8rem;
    text-align: center;
    margin-bottom: 6px;
    line-height: 1;
  }

  #mode2 .alphabet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
    gap: 11px;
    width: 100%;
  }

  #mode2 .letter-tile {
    background: rgba(255,255,255,0.93);
    border-radius: 20px;
    padding: 13px 6px 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.13);
    transition: transform 0.18s, box-shadow 0.18s;
    border: 3px solid transparent;
  }
  #mode2 .letter-tile:hover { transform: translateY(-6px) scale(1.09); box-shadow: 0 14px 32px rgba(0,0,0,0.2); }
  #mode2 .letter-tile:active { transform: scale(0.91); }

  #mode2 .big-letter {
    font-family: 'Fredoka One', cursive;
    font-size: 2.8rem;
    line-height: 1;
    display: block;
  }
  #mode2 .small-letter {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    display: block;
    margin-top: 2px;
    opacity: 0.6;
  }
  #mode2 .word-hint {
    font-size: 0.65rem;
    font-weight: 800;
    color: #555;
    display: block;
    margin-top: 3px;
  }

  #mode2 .letter-tile:nth-child(6n+1) { border-color: #ff6b6b; }
  #mode2 .letter-tile:nth-child(6n+1) .big-letter { color: #ff6b6b; }
  #mode2 .letter-tile:nth-child(6n+2) { border-color: #feca57; }
  #mode2 .letter-tile:nth-child(6n+2) .big-letter { color: #c79100; }
  #mode2 .letter-tile:nth-child(6n+3) { border-color: #1dd1a1; }
  #mode2 .letter-tile:nth-child(6n+3) .big-letter { color: #00a67e; }
  #mode2 .letter-tile:nth-child(6n+4) { border-color: #54a0ff; }
  #mode2 .letter-tile:nth-child(6n+4) .big-letter { color: #0065db; }
  #mode2 .letter-tile:nth-child(6n+5) { border-color: #fd79a8; }
  #mode2 .letter-tile:nth-child(6n+5) .big-letter { color: #e6005a; }
  #mode2 .letter-tile:nth-child(6n+6) { border-color: #a29bfe; }
  #mode2 .letter-tile:nth-child(6n+6) .big-letter { color: #5c4dd1; }

  /* ======== MODE 3 — MATCH UPPERCASE TO LOWERCASE ======== */
  .quiz3-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; }

  .quiz3-question {
    background: rgba(255,255,255,0.95);
    border-radius: 28px;
    padding: 26px 30px 22px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.14);
    width: 100%;
  }

  .quiz3-label {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 0.95rem;
    color: #aaa;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .quiz3-big {
    font-family: 'Fredoka One', cursive;
    font-size: 7rem;
    line-height: 1;
    text-shadow: 0 4px 0 rgba(0,0,0,0.08);
  }

  .quiz3-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
  }

  .quiz3-opt {
    font-family: 'Fredoka One', cursive;
    font-size: 3.6rem;
    padding: 18px 10px;
    border: none;
    border-radius: 22px;
    cursor: pointer;
    color: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.14);
    transition: transform 0.15s, box-shadow 0.15s;
    line-height: 1;
  }
  .quiz3-opt:nth-child(1) { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
  .quiz3-opt:nth-child(2) { background: linear-gradient(135deg, #0abde3, #0984e3); }
  .quiz3-opt:nth-child(3) { background: linear-gradient(135deg, #1dd1a1, #00b894); }
  .quiz3-opt:nth-child(4) { background: linear-gradient(135deg, #fd79a8, #e84393); }
  .quiz3-opt:hover:not(:disabled) { transform: translateY(-4px) scale(1.05); box-shadow: 0 12px 28px rgba(0,0,0,0.2); }
  .quiz3-opt:active:not(:disabled) { transform: scale(0.94); }
  .quiz3-opt:disabled { cursor: default; }
  .quiz3-opt.correct {
    box-shadow: 0 0 0 5px #fff, 0 0 0 8px #1dd1a1;
    animation: correctBounce 0.4s cubic-bezier(.23,1.5,.5,1);
  }
  .quiz3-opt.wrong { filter: brightness(0.5) grayscale(0.6); }

  @keyframes correctBounce {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .quiz3-score {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    display: flex;
    gap: 18px;
  }
  .q3-badge {
    background: rgba(255,255,255,0.28);
    border-radius: 40px;
    padding: 6px 20px;
    border: 2px solid rgba(255,255,255,0.45);
  }

  .quiz3-feedback {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    min-height: 40px;
    text-align: center;
    animation: feedIn 0.3s cubic-bezier(.23,1.5,.5,1);
  }
  @keyframes feedIn {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .quiz3-next {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    padding: 13px 42px;
    background: linear-gradient(135deg, #fdcb6e, #e17055);
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    transition: transform 0.15s;
    display: none;
  }
  .quiz3-next.show { display: block; animation: feedIn 0.3s cubic-bezier(.23,1.5,.5,1); }
  .quiz3-next:hover { transform: scale(1.06); }

  .quiz3-end { text-align: center; animation: cardIn 0.5s cubic-bezier(.23,1.5,.5,1); }
  .quiz3-end .end-emoji { font-size: 4rem; display: block; margin-bottom: 8px; }
  .quiz3-end .end-score {
    font-family: 'Fredoka One', cursive;
    font-size: 3.5rem;
    color: #fff;
    text-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }
  .quiz3-end .end-msg {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    color: rgba(255,255,255,0.88);
    margin: 8px 0 20px;
  }
  .quiz3-restart {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    padding: 14px 44px;
    background: linear-gradient(135deg, #a29bfe, #6c5ce7);
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(108,92,231,0.4);
    transition: transform 0.15s;
  }
  .quiz3-restart:hover { transform: scale(1.06); }

  .hidden { display: none !important; }

  /* ---- POPUP ---- */
  .popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s;
  }
  .popup-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .popup-box {
    background: linear-gradient(150deg, #fff 55%, #f0f4ff 100%);
    border-radius: 36px;
    padding: 34px 44px 30px;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0,0,0,0.32);
    animation: popIn 0.35s cubic-bezier(.23,1.5,.5,1);
    max-width: 340px;
    width: 90%;
  }
  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .pop-letter {
    font-family: 'Fredoka One', cursive;
    font-size: 6.5rem;
    line-height: 1;
    display: block;
  }
  .pop-emoji { font-size: 3.2rem; margin: 6px 0 3px; display: block; }
  .pop-word {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    color: #333;
    margin-bottom: 2px;
  }
  /* shown only in mode 2 popup */
  .pop-tr {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    color: #888;
    margin-bottom: 4px;
  }
  .pop-phonetic {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: #6c5ce7;
    background: #f0eeff;
    border-radius: 12px;
    padding: 5px 14px;
    display: inline-block;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }
  .pop-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .pop-speak {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    padding: 13px 28px;
    background: linear-gradient(135deg, #0abde3, #0984e3);
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(9,132,227,0.38);
    transition: transform 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pop-speak:hover { transform: scale(1.06); }
  .pop-speak:active { transform: scale(0.95); }
  .pop-speak.speaking {
    animation: speakPulse 0.6s ease infinite alternate;
  }
  @keyframes speakPulse {
    from { box-shadow: 0 6px 20px rgba(9,132,227,0.38); }
    to   { box-shadow: 0 6px 30px rgba(9,132,227,0.85), 0 0 0 7px rgba(9,132,227,0.18); }
  }
  .pop-close {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    padding: 13px 28px;
    background: linear-gradient(135deg, #fd79a8, #e84393);
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(232,67,147,0.35);
    transition: transform 0.15s;
  }
  .pop-close:hover { transform: scale(1.06); }

  @media (max-width: 500px) {
    .card { padding: 16px 10px; }
    #mode1 .alphabet-grid, #mode2 .alphabet-grid { gap: 7px; }
    #mode1 .big-letter, #mode2 .big-letter { font-size: 2.2rem; }
    #mode2 .flag-row { font-size: 3rem; }
    .popup-box { padding: 26px 20px 22px; }
    .pop-letter { font-size: 5rem; }
  }
</style>
</head>
<body>

<!-- FLOATING SHAPES -->
<div class="shapes-layer" id="shapesLayer"></div>

<div class="header">
  <h1>ALPHABET</h1>
</div>

<nav class="nav">
  <button class="nav-btn n1 active" onclick="switchMode(1)">🔤 Буквы</button>
  <button class="nav-btn n2" onclick="switchMode(2)">🇬🇧 Слова</button>
  <button class="nav-btn n3" onclick="switchMode(3)">🔡 Найди пару</button>
</nav>

<div class="card">

  <!-- MODE 1: big letters, no words, click = sound -->
  <div id="mode1">
    <div class="mode-title">🎓 Нажми на букву!</div>
    <div class="alphabet-grid" id="grid1"></div>
  </div>

  <!-- MODE 2: letters + words + popup -->
  <div id="mode2" class="hidden">
    <div class="flag-row">🇬🇧</div>
    <div class="mode-title">Нажми на букву!</div>
    <div class="alphabet-grid" id="grid2"></div>
  </div>

  <!-- MODE 3: match uppercase to lowercase -->
  <div id="mode3" class="hidden">
    <div class="mode-title">🔡 Найди строчную букву!</div>
    <div class="quiz3-wrap" id="quiz3Wrap">
      <div class="quiz3-score">
        <span class="q3-badge">✅ <span id="q3correct">0</span></span>
        <span class="q3-badge">❌ <span id="q3wrong">0</span></span>
        <span class="q3-badge">📝 <span id="q3num">1</span>/26</span>
      </div>
      <div class="quiz3-question">
        <div class="quiz3-big" id="q3letter" style="color:#6c5ce7">A</div>
      </div>
      <div class="quiz3-options" id="q3options"></div>
      <div class="quiz3-feedback" id="q3feedback"></div>
      <button class="quiz3-next" id="q3next" onclick="q3Next()">Следующая ➡️</button>
    </div>
    <div class="quiz3-end hidden" id="quiz3End">
      <span class="end-emoji" id="q3endEmoji">🏆</span>
      <div class="end-score" id="q3endScore">26/26</div>
      <div class="end-msg" id="q3endMsg">Идеально!</div>
      <button class="quiz3-restart" onclick="q3Restart()">🔄 Заново</button>
    </div>
  </div>

</div> (mode 2) -->
<div class="popup-overlay" id="popup" onclick="handleOverlayClick(event)">
  <div class="popup-box">
    <span class="pop-letter" id="popLetter">A</span>
    <span class="pop-emoji" id="popEmoji">🍎</span>
    <div class="pop-word" id="popWord">Apple</div>
    <div class="pop-tr" id="popTr">яблоко</div>
    <div class="pop-phonetic" id="popPhonetic">/ˈæp.əl/</div>
    <div class="pop-buttons">
      <button class="pop-speak" id="popSpeakBtn" onclick="speakCurrent()">🔊 Произношение</button>
      <button class="pop-close" onclick="closePopup()">✕ Закрыть</button>
    </div>
  </div>
</div>

<script>
const LETTERS = [
  { l:'A', word:'Apple',     tr:'яблоко',          e:'🍎', ipa:'/ˈæp.əl/'      },
  { l:'B', word:'Ball',      tr:'мяч',             e:'⚽', ipa:'/bɔːl/'         },
  { l:'C', word:'Cat',       tr:'кошка',           e:'🐱', ipa:'/kæt/'          },
  { l:'D', word:'Dog',       tr:'собака',          e:'🐶', ipa:'/dɒɡ/'          },
  { l:'E', word:'Elephant',  tr:'слон',            e:'🐘', ipa:'/ˈel.ɪ.fənt/'   },
  { l:'F', word:'Fish',      tr:'рыба',            e:'🐟', ipa:'/fɪʃ/'          },

  { l:'J', word:'Jellyfish', tr:'медуза',          e:'🪼', ipa:'/ˈdʒel.i.fɪʃ/' },
  { l:'K', word:'Kite',      tr:'воздушный змей',  e:'🪁', ipa:'/kaɪt/'         },
  { l:'L', word:'Lion',      tr:'лев',             e:'🦁', ipa:'/ˈlaɪ.ən/'      },

];

const COLORS = ['#ff6b6b','#c79100','#00a67e','#0065db','#e6005a','#5c4dd1'];

// ---- FLOATING SHAPES ----
const SHAPES = ['⭐','🌟','✨','⚪','🔵','💛','🟡','⭕'];
const shapesLayer = document.getElementById('shapesLayer');
for (let i = 0; i < 28; i++) {
  const s = document.createElement('div');
  s.className = 'shape';
  const sym = i % 2 === 0 ? '⭐' : '⚪';
  s.textContent = sym;
  const size = 1.2 + Math.random() * 1.6;
  const left = Math.random() * 100;
  const delay = Math.random() * 6;
  const dur = 4 + Math.random() * 5;
  const top = Math.random() * 100;
  s.style.cssText = `
    font-size:${size}rem;
    left:${left}%;
    top:${top}%;
    animation-duration:${dur}s;
    animation-delay:-${delay}s;
    opacity:${0.65 + Math.random() * 0.3};
    filter: drop-shadow(0 0 10px rgba(255,215,0,0.95)) drop-shadow(0 0 5px rgba(255,255,255,0.8));
    color: #FFD700;
  `;
  shapesLayer.appendChild(s);
}

// ---- BUILD GRIDS ----
function buildGrid(containerId, mode) {
  const g = document.getElementById(containerId);
  LETTERS.forEach((item, i) => {
    const tile = document.createElement('div');
    tile.className = 'letter-tile';
    if (mode === 1) {
      tile.innerHTML = `<span class="big-letter">${item.l}</span><span class="small-letter">${item.l.toLowerCase()}</span>`;
      tile.onclick = () => speakLetter(item, tile);
    } else {
      tile.innerHTML = `<span class="big-letter">${item.l}</span><span class="small-letter">${item.l.toLowerCase()}</span><span class="word-hint">${item.word}</span>`;
      tile.onclick = () => openPopup(item, i);
    }
    g.appendChild(tile);
  });
}

buildGrid('grid1', 1);
buildGrid('grid2', 2);

// ---- MODE 1: speak letter only ----
function speakLetter(item, tile) {
  tile.style.transform = 'scale(0.88)';
  setTimeout(() => tile.style.transform = '', 200);
  speak(item.l + '.', false);
}

// ---- MODE 2: popup ----
let currentItem = null;

function openPopup(item, idx) {
  currentItem = item;
  document.getElementById('popLetter').textContent = item.l;
  document.getElementById('popLetter').style.color = COLORS[idx % 6];
  document.getElementById('popEmoji').textContent = item.e;
  document.getElementById('popWord').textContent = item.word;
  document.getElementById('popTr').textContent = item.tr;
  document.getElementById('popPhonetic').textContent = item.ipa;
  document.getElementById('popSpeakBtn').classList.remove('speaking');
  document.getElementById('popup').classList.add('show');
  setTimeout(() => speakCurrent(), 350);
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('popup')) closePopup();
}

function closePopup() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.getElementById('popup').classList.remove('show');
  document.getElementById('popSpeakBtn').classList.remove('speaking');
}

function speakCurrent() {
  if (!currentItem) return;
  speakWithPause(currentItem.l, currentItem.word);
}

// ---- SPEECH ----
function getBritishVoice() {
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang === 'en-GB') ||
         voices.find(v => v.lang.startsWith('en-GB')) ||
         voices.find(v => v.name.toLowerCase().includes('british')) ||
         voices.find(v => v.lang.startsWith('en'));
}

function makeUtterance(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB';
  u.rate = 0.82;
  u.pitch = 1.05;
  const v = getBritishVoice();
  if (v) u.voice = v;
  return u;
}

// Speak letter, pause 900ms, then speak word
function speakWithPause(letter, word) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const btn = document.getElementById('popSpeakBtn');
  btn.classList.add('speaking');

  const u1 = makeUtterance(letter + '.');
  const u2 = makeUtterance(word);

  u1.onend = () => {
    setTimeout(() => {
      window.speechSynthesis.speak(u2);
    }, 1200);
  };
  u2.onend  = () => btn.classList.remove('speaking');
  u2.onerror= () => btn.classList.remove('speaking');
  u1.onerror= () => btn.classList.remove('speaking');

  window.speechSynthesis.speak(u1);
}

function speak(text, isWord) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const btn = document.getElementById('popSpeakBtn');
  if (isWord) btn.classList.add('speaking');
  const u = makeUtterance(text);
  u.onend  = () => btn.classList.remove('speaking');
  u.onerror= () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

// ---- MODE 3: match uppercase → lowercase ----
const Q3COLORS = ['#ff6b6b','#0065db','#00a67e','#e6005a','#c79100','#5c4dd1'];
let q3Order = [], q3Cur = 0, q3CorrectCount = 0, q3WrongCount = 0, q3Answered = false;

function q3Shuffle() {
  q3Order = [...Array(26).keys()];
  for (let i = q3Order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [q3Order[i], q3Order[j]] = [q3Order[j], q3Order[i]];
  }
}

function q3Build() {
  q3Answered = false;
  const idx = q3Order[q3Cur];
  const correct = LETTERS[idx];
  document.getElementById('q3letter').textContent = correct.l;
  document.getElementById('q3letter').style.color = Q3COLORS[idx % 6];
  document.getElementById('q3feedback').textContent = '';
  document.getElementById('q3next').classList.remove('show');
  document.getElementById('q3num').textContent = `${q3Cur + 1}/26`;

  // 4 options: correct + 3 wrong
  const opts = [idx];
  while (opts.length < 4) {
    const r = Math.floor(Math.random() * 26);
    if (!opts.includes(r)) opts.push(r);
  }
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }

  const container = document.getElementById('q3options');
  container.innerHTML = '';
  opts.forEach(oIdx => {
    const btn = document.createElement('button');
    btn.className = 'quiz3-opt';
    btn.textContent = LETTERS[oIdx].l.toLowerCase();
    btn.onclick = () => q3Check(oIdx, idx, btn, container);
    container.appendChild(btn);
  });
}

function q3Check(chosen, correct, btn, container) {
  if (q3Answered) return;
  q3Answered = true;
  container.querySelectorAll('.quiz3-opt').forEach(b => b.disabled = true);

  if (chosen === correct) {
    btn.classList.add('correct');
    q3CorrectCount++;
    document.getElementById('q3feedback').textContent = `✅ Верно! ${LETTERS[correct].l} → ${LETTERS[correct].l.toLowerCase()}`;
  } else {
    btn.classList.add('wrong');
    q3WrongCount++;
    container.querySelectorAll('.quiz3-opt').forEach(b => {
      if (b.textContent === LETTERS[correct].l.toLowerCase()) b.classList.add('correct');
    });
    document.getElementById('q3feedback').textContent = `❌ Нет! ${LETTERS[correct].l} → ${LETTERS[correct].l.toLowerCase()}`;
  }

  document.getElementById('q3correct').textContent = q3CorrectCount;
  document.getElementById('q3wrong').textContent = q3WrongCount;

  if (q3Cur < 25) {
    document.getElementById('q3next').classList.add('show');
  } else {
    setTimeout(q3End, 700);
  }
}

function q3Next() { q3Cur++; q3Build(); }

function q3End() {
  document.getElementById('quiz3Wrap').classList.add('hidden');
  const end = document.getElementById('quiz3End');
  end.classList.remove('hidden');
  const pct = q3CorrectCount / 26;
  document.getElementById('q3endScore').textContent = `${q3CorrectCount} / 26`;
  const [emoji, msg] = pct === 1 ? ['🏆','Идеально! Все буквы знаешь!']
    : pct >= 0.8 ? ['🌟','Отлично! Почти идеально!']
    : pct >= 0.5 ? ['😊','Неплохо! Ещё немного практики!']
    : ['💪','Не сдавайся — учи алфавит!'];
  document.getElementById('q3endEmoji').textContent = emoji;
  document.getElementById('q3endMsg').textContent = msg;
}

function q3Restart() {
  q3Cur = 0; q3CorrectCount = 0; q3WrongCount = 0;
  document.getElementById('q3correct').textContent = 0;
  document.getElementById('q3wrong').textContent = 0;
  document.getElementById('quiz3End').classList.add('hidden');
  document.getElementById('quiz3Wrap').classList.remove('hidden');
  q3Shuffle(); q3Build();
}

// ---- SWITCH MODE ----
function switchMode(n) {
  document.getElementById('mode1').classList.toggle('hidden', n !== 1);
  document.getElementById('mode2').classList.toggle('hidden', n !== 2);
  document.getElementById('mode3').classList.toggle('hidden', n !== 3);
  document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i + 1 === n));
  if (n !== 2) closePopup();
  if (n === 3 && q3Order.length === 0) { q3Shuffle(); q3Build(); }
}

// voices async (Chrome)
window.speechSynthesis && window.speechSynthesis.getVoices();
window.speechSynthesis && (window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices());
</script>
