@keyframes flipIn{from{transform:rotateY(-90deg);opacity:0}to{transform:rotateY(0);opacity:1}}
.screen{min-height:100vh;font-family:'Nunito',sans-serif}
.btn-back{background:rgba(255,255,255,.25);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.5);border-radius:50px;padding:9px 20px;color:white;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;font-size:15px;letter-spacing:.3px}
.btn-back:active{transform:scale(.93)}
.theme-card{border:2px solid rgba(255,255,255,.25);border-radius:22px;padding:24px 14px 20px;cursor:pointer;color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:1.05rem;box-shadow:0 8px 32px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .2s,box-shadow .2s;animation:slideIn .45s ease both}
.theme-card:hover{transform:translateY(-5px) scale(1.03)}
.theme-card:active{transform:scale(.95)}

.mode-card:hover{transform:translateY(-4px) scale(1.02)}
.mode-card:active{transform:scale(.96)}
.word-card{background:linear-gradient(160deg,#fff,var(--t1),var(--t2));border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.85);padding:32px 28px 28px;display:flex;flex-direction:column;align-items:center;gap:0}
.listen-btn{border:none;border-radius:50px;padding:13px 32px;color:white;font-weight:800;cursor:pointer;font-size:1.05rem;font-family:'Nunito',sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px}
.listen-btn:active{transform:scale(.95)}
.nav-btn{background:rgba(255,255,255,.25);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.5);border-radius:50px;padding:12px 28px;color:white;font-size:22px;cursor:pointer}
.nav-btn:active{transform:scale(.93)}
.opt-btn{border:none;border-radius:18px;padding:17px 22px;cursor:pointer;font-weight:800;font-size:1.2rem;font-family:'Nunito',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.12);transition:all .2s;width:100%}
.opt-btn:active{transform:scale(.96)}
.opt-btn.correct{background:#27ae60!important;color:white!important;animation:correctPop .45s ease;box-shadow:0 8px 24px rgba(39,174,96,.4)!important}
.opt-btn.wrong{background:#e74c3c!important;color:white!important;animation:shake .45s ease;box-shadow:0 8px 24px rgba(231,76,60,.4)!important}
.opt-btn:not(.correct):not(.wrong):not([disabled]):hover{transform:scale(1.03);filter:brightness(1.05)}
.prog-bar{height:7px;background:rgba(255,255,255,.28);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:white;border-radius:4px;transition:width .45s ease;box-shadow:0 0 8px rgba(255,255,255,.6)}
.float-el{position:fixed;pointer-events:none;z-index:0}
.confetti-wrap{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden}
.confetti-p{position:absolute;top:-20px;border-radius:3px}
.result-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;color:white;padding:20px;text-align:center}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.4);border-radius:3px}

// ─── HELPERS ───
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function speak(text){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.82;u.pitch=1.05;window.speechSynthesis.speak(u)}

function tint(hex,pct){try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);const f=1-pct;return`rgb(${Math.round(r*pct+255*f)},${Math.round(g*pct+255*f)},${Math.round(b*pct+255*f)})`}catch{return'rgb(248,246,255)'}}

function playOK(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.setValueAtTime(523,a.currentTime);o.frequency.setValueAtTime(659,a.currentTime+.1);o.frequency.setValueAtTime(784,a.currentTime+.2);g.gain.setValueAtTime(.3,a.currentTime);g.gain.exponentialRampToValueAtTime(.01,a.currentTime+.55);o.start(a.currentTime);o.stop(a.currentTime+.55)}catch(e){}}
function playFail(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sawtooth';o.frequency.setValueAtTime(220,a.currentTime);o.frequency.setValueAtTime(160,a.currentTime+.18);g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.01,a.currentTime+.35);o.start(a.currentTime);o.stop(a.currentTime+.35)}catch(e){}}

// Render emoji or SVG image
function emojiImg(e,size){
  if(e&&e.startsWith('data:')){
    return`<img src="${e}" style="width:${size}px;height:${size}px;object-fit:contain;display:block;margin:0 auto">`;
  }
  return`<span style="font-size:${size}px;line-height:1;display:block;text-align:center">${e}</span>`;
}

// Confetti particles (stable)
const CONF_PARTS=(()=>{
  const colors=["#e74c3c","#f39c12","#2ecc71","#3498db","#9b59b6","#e91e63","#00bcd4","#ff5722","#ffeb3b","#ff69b4","#adff2f"];
  return Array.from({length:90}).map((_,i)=>({
    left:(Math.random()*100).toFixed(1),
    w:(Math.random()*13+5).toFixed(1),
    h:(Math.random()*13+5).toFixed(1),
    color:colors[i%colors.length],
    round:Math.random()>.5,
    dur:(Math.random()*2+1.4).toFixed(2),
    delay:(Math.random()*.9).toFixed(2),
    rot:Math.floor(Math.random()*360),
  }));
})();

function confettiHTML(){
  return`<div class="confetti-wrap">${CONF_PARTS.map(p=>`<div class="confetti-p" style="left:${p.left}%;width:${p.w}px;height:${p.h}px;background:${p.color};border-radius:${p.round?'50%':'3px'};animation:confettiFall ${p.dur}s linear ${p.delay}s forwards;transform:rotate(${p.rot}deg)"></div>`).join('')}</div>`;
}

  let html=`<div class="screen" style="background:${bg};background-size:600% 600%;animation:bgShift 6s ease infinite;padding:20px 16px 32px;position:relative;overflow:hidden">`;
  html+=floatsHTML();
  html+=`<div style="text-align:center;margin-bottom:26px;position:relative;z-index:1">
    <div style="font-size:60px;margin-bottom:6px;animation:floatStar 3.5s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(255,255,255,.8))">🇬🇧</div>
    <h1 style="font-family:'Fredoka One',cursive;font-size:clamp(2.4rem,7vw,3.6rem);color:white;text-shadow:0 3px 16px rgba(0,0,0,.4);line-height:1.1;margin:0">English Words</h1>
    <p style="color:white;font-size:1.1rem;margin-top:6px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.35)">250 слов по темам для школьников 🚀</p>
    ${S.totalStars>0?`<div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);border-radius:50px;padding:8px 22px;margin-top:12px;color:white;font-weight:900;font-size:1.2rem;border:2px solid rgba(255,255,255,.5)">⭐ ${S.totalStars} звёзд</div>`:''}
  </div>`;
  html+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;max-width:720px;margin:0 auto;position:relative;z-index:1">`;
  T.forEach((t,i)=>{
    html+=`<button class="theme-card" onclick="selectTheme(${i})" style="background:${t.g};animation-delay:${i*.065}s">
      <span style="font-size:3rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))">${t.emoji}</span>

  const modes=[

    {id:'phrases',emoji:'💬',name:'Фразы',desc:'Вставь пропущенное слово — выбери из 3 вариантов',g:'linear-gradient(135deg,#1565c0,#2980b9,#3498db)',c:'#2980b9'},
    {id:'quiz',emoji:'⚡',name:'Быстрый тест',desc:'Русское слово → выбери правильный английский перевод',g:'linear-gradient(135deg,#8b0000,#c0392b,#e74c3c)',c:'#c0392b'},
    {id:'idioms',emoji:'🎭',name:'Идиомы',desc:'Английские идиомы с переводом и объяснением',g:'linear-gradient(135deg,#4a0080,#8e44ad,#9b59b6)',c:'#8e44ad'},
  ];

      <div style="font-size:56px;animation:floatStar 3.5s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,255,255,.6))">${t.emoji}</div>
      <h2 style="font-family:'Fredoka One',cursive;font-size:2.2rem;color:white;text-shadow:0 2px 12px rgba(0,0,0,.3);margin:10px 0 4px">${t.name} <span style="font-size:1.4rem;opacity:.75">(${t.nameEn})</span></h2>
      <p style="color:rgba(255,255,255,.9);font-weight:700;font-size:1.05rem">Выбери режим</p>
    </div>
    <div style="display:grid;gap:14px;max-width:520px;margin:0 auto">`;
  modes.forEach((m,i)=>{
    html+=`<button class="mode-card" onclick="selectMode('${m.id}')" style="animation-delay:${i*.09}s">
      <div style="width:74px;height:74px;background:${m.g};border-radius:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 24px ${m.c}88;border:2.5px solid rgba(255,255,255,.5);position:relative;overflow:hidden">
        <span style="font-size:2.5rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));position:relative;z-index:1">${m.emoji}</span>
      </div>

  let html=`<div class="screen" style="background:${t.g};padding:20px 16px" id="learn-screen">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="btn-back" onclick="go('modes')">← Назад</button>
      <span style="color:white;font-weight:800;font-size:1rem;background:rgba(255,255,255,.22);padding:7px 16px;border-radius:50px;border:1.5px solid rgba(255,255,255,.4)">${S.learnIdx+1} / ${t.w.length}</span>
    </div>
    <div style="max-width:440px;margin:24px auto;display:flex;flex-direction:column;align-items:center;gap:20px">

        <div style="margin-bottom:14px">${emojiImg(w.e,82)}</div>
        <div style="font-family:'Fredoka One',cursive;font-size:2.8rem;color:#1a1a2e;letter-spacing:.5px;line-height:1.1">${w.en}</div>
        <div style="font-size:1.2rem;color:#666;margin-top:8px;font-style:italic;font-weight:700;letter-spacing:.3px">${w.t}</div>
        <div style="width:60%;height:2px;background:linear-gradient(90deg,transparent,${t.color}55,transparent);margin:18px 0"></div>
        <div style="font-family:'Fredoka One',cursive;font-size:2.4rem;color:#1a1a2e;letter-spacing:.5px;line-height:1.2;text-align:center">${w.ru}</div>
        <button class="listen-btn" onclick="speak('${w.en.replace(/'/g,"\\'")}');event.stopPropagation()" style="margin-top:22px;background:${t.g}">

      <div style="display:flex;gap:16px">
        <button class="nav-btn" onclick="learnNav(-1)">◀</button>
        <button class="nav-btn" onclick="learnNav(1)">▶</button>
      </div>
    </div>
  </div>`;

}

function renderPhrases(){
  const t=S.theme;
  if(S.phraseIdx>=S.phraseItems.length){
    const s=Math.round((S.phraseCorrect/S.phraseItems.length)*5);
    return renderResult(s);
  }
  const w=S.phraseItems[S.phraseIdx];
  const t1=tint(t.color,.06), t2=tint(t.color,.11);
  const pct=((S.phraseIdx+1)/S.phraseItems.length*100).toFixed(1);
  const parts=w.p.split('___');
  let html=`<div class="screen" style="background:${t.g};padding:20px 16px">
    ${S.showConf?confettiHTML():''}
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="btn-back" onclick="go('modes')">← Назад</button>
      <span style="color:white;font-weight:800;background:rgba(255,255,255,.22);padding:7px 16px;border-radius:50px;border:1.5px solid rgba(255,255,255,.4)">${S.phraseIdx+1}/${S.phraseItems.length}</span>
    </div>
    <div style="max-width:480px;margin:26px auto">
      <div class="prog-bar" style="margin-bottom:22px"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div id="phrase-card" style="background:linear-gradient(160deg,#fff,${t1},${t2});border-radius:26px;padding:28px 26px;box-shadow:0 16px 50px rgba(0,0,0,.22);text-align:center;border:2px solid rgba(255,255,255,.5)">
        <div style="margin-bottom:10px">${emojiImg(w.e,52)}</div>
        <p style="font-size:1.2rem;color:#1a1a2e;font-weight:800;line-height:1.7">
          ${parts[0]}<span style="display:inline-block;width:88px;height:3px;background:${t.color};margin:0 5px 4px;border-radius:3px;opacity:.7;vertical-align:middle"></span>${parts[1]||''}
        </p>
      </div>
      <div style="display:grid;gap:13px;margin-top:18px">`;
  S.phraseOpts.forEach((o,i)=>{
    const isCorrect=S.phraseSel&&o.en===w.en;
    const isWrong=S.phraseSel===o.en&&o.en!==w.en;
    const cls=isCorrect?'correct':isWrong?'wrong':'';
    const bg=isCorrect?'#27ae60':isWrong?'#e74c3c':`linear-gradient(160deg,#fff,${t2})`;
    const col=isCorrect||isWrong?'white':'#1a1a2e';
    html+=`<button class="opt-btn ${cls}" onclick="pickPhrase(${i})" ${S.phraseSel?'disabled':''} style="background:${bg};color:${col};border:${isCorrect||isWrong?'none':`2px solid rgba(255,255,255,.75)`}">
      ${o.en} <span style="opacity:.45;font-size:.9rem;font-weight:600">${o.t}</span>
    </button>`;
  });
  html+=`</div></div></div>`;
  return html;
}

function renderQuiz(){
  const t=S.theme;
  if(S.quizIdx>=S.quizItems.length){
    const s=Math.round((S.quizCorrect/S.quizItems.length)*5);
    return renderResult(s,`Лучшая серия: ${S.quizBest} 🔥`);
  }
  const w=S.quizItems[S.quizIdx];
  const t1=tint(t.color,.06), t2=tint(t.color,.11);
  const pct=((S.quizIdx+1)/S.quizItems.length*100).toFixed(1);
  const progColor=S.quizStreak>2?'#FFD700':'white';
  let html=`<div class="screen" style="background:${t.g};padding:20px 16px">
    ${S.showConf?confettiHTML():''}
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="btn-back" onclick="go('modes')">← Назад</button>
      <div style="display:flex;gap:10px;align-items:center">
        ${S.quizStreak>1?`<span style="color:#FFD700;font-weight:900;font-size:1.2rem;animation:pulse 1s ease infinite;text-shadow:0 0 10px rgba(255,200,0,.6)">🔥${S.quizStreak}</span>`:''}
        <span style="color:white;font-weight:800;background:rgba(255,255,255,.22);padding:7px 16px;border-radius:50px;border:1.5px solid rgba(255,255,255,.4)">${S.quizIdx+1}/${S.quizItems.length}</span>
      </div>
    </div>
    <div style="max-width:480px;margin:26px auto">
      <div class="prog-bar" style="margin-bottom:22px"><div class="prog-fill" style="width:${pct}%;background:${progColor};${S.quizStreak>2?'box-shadow:0 0 12px rgba(255,200,0,.7)':''}"></div></div>
      <div id="quiz-card" style="background:linear-gradient(160deg,#fff,${t1},${t2});border-radius:26px;padding:32px 26px;box-shadow:0 16px 50px rgba(0,0,0,.22);text-align:center;border:2px solid rgba(255,255,255,.5)">
        <div style="margin-bottom:12px">${emojiImg(w.e,72)}</div>
        <div style="font-family:'Fredoka One',cursive;font-size:2.2rem;color:#1a1a2e">${w.ru}</div>
        <p style="font-size:1rem;color:#888;font-weight:700;margin-top:10px">Выбери правильный английский перевод:</p>
      </div>
      <div style="display:grid;gap:13px;margin-top:18px">`;
  S.quizOpts.forEach((o,i)=>{
    const isCorrect=S.quizSel&&o.en===w.en;
    const isWrong=S.quizSel===o.en&&o.en!==w.en;
    const cls=isCorrect?'correct':isWrong?'wrong':'';
    const bg=isCorrect?'#27ae60':isWrong?'#e74c3c':`linear-gradient(160deg,#fff,${t2})`;
    const col=isCorrect||isWrong?'white':'#1a1a2e';
    html+=`<button class="opt-btn ${cls}" onclick="pickQuiz(${i})" ${S.quizSel?'disabled':''} style="background:${bg};color:${col};border:${isCorrect||isWrong?'none':`2px solid rgba(255,255,255,.75)`}">
      ${o.en} <span style="opacity:.4;font-size:.9rem">${o.t}</span>
    </button>`;
  });
  html+=`</div></div></div>`;
  return html;
}

function renderResult(stars, extra=''){
  const t=S.theme;
  const correct = S.screen==='phrases'?S.phraseCorrect:S.quizCorrect;
  const total = S.screen==='phrases'?S.phraseItems.length:S.quizItems.length;
  return`<div class="result-screen" style="background:${t.g}">
    ${confettiHTML()}
    <div style="font-size:88px;margin-bottom:16px;animation:floatStar 3s ease-in-out infinite">🎉</div>
    <h2 style="font-family:'Fredoka One',cursive;font-size:2.4rem;text-shadow:0 2px 10px rgba(0,0,0,.25)">Отлично!</h2>
    <p style="font-size:1.3rem;margin-top:10px;font-weight:700">${correct} из ${total} правильно</p>
    ${extra?`<p style="font-size:1.1rem;margin-top:6px;opacity:.9">${extra}</p>`:''}
    <div style="font-size:2.2rem;margin-top:10px;letter-spacing:4px">${'⭐'.repeat(stars)}${'☆'.repeat(5-stars)}</div>
    <button class="btn-back" onclick="go('modes')" style="margin-top:28px;font-size:1.15rem;padding:14px 36px;box-shadow:0 8px 24px rgba(0,0,0,.2)">← Меню</button>
  </div>`;
}

function renderIdioms(){
  const id=IDIOMS[S.idiomIdx];
  const bg='linear-gradient(-45deg,#7c3aed,#db2777,#f59e0b,#10b981,#7c3aed)';
  let html=`<div class="screen" style="background:${bg};background-size:600% 600%;animation:bgShift 7s ease infinite;padding:20px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="btn-back" onclick="go('modes')">← Назад</button>
      <span style="color:white;font-weight:800;background:rgba(255,255,255,.22);padding:7px 16px;border-radius:50px;border:1.5px solid rgba(255,255,255,.4)">${S.idiomIdx+1}/${IDIOMS.length}</span>
    </div>
    <div style="max-width:480px;margin:28px auto;text-align:center">
      <h2 style="font-family:'Fredoka One',cursive;font-size:2rem;color:white;text-shadow:0 2px 12px rgba(0,0,0,.3);margin-bottom:22px">🎭 English Idioms</h2>
      <div style="cursor:pointer;perspective:900px" onclick="S.idiomFlipped=!S.idiomFlipped;render()">
        <div style="width:100%;min-height:320px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);transform:${S.idiomFlipped?'rotateY(180deg)':'rotateY(0)'}">
          <div style="position:absolute;top:0;left:0;width:100%;min-height:320px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:rgba(255,255,255,.97);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;border:2px solid rgba(255,255,255,.5)">
            <div style="font-size:52px;margin-bottom:14px">🇬🇧</div>
            <div style="font-family:'Fredoka One',cursive;font-size:1.4rem;color:#1a1a2e;line-height:1.5;text-align:center">${id.en}</div>
            <button onclick="speak('${id.en.replace(/'/g,"\\'")}');event.stopPropagation()" style="margin-top:18px;background:linear-gradient(135deg,#7c3aed,#db2777);border:none;border-radius:50px;padding:12px 28px;color:white;font-weight:800;cursor:pointer;font-size:1rem;font-family:'Nunito',sans-serif;box-shadow:0 6px 20px rgba(124,58,237,.35)">🔊 Послушать</button>
            <div style="margin-top:14px;font-size:.9rem;color:#bbb;font-weight:600">Нажми для перевода ➜</div>
          </div>
          <div style="position:absolute;top:0;left:0;width:100%;min-height:320px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);background:linear-gradient(135deg,#7c3aed,#db2777);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;color:white;border:2px solid rgba(255,255,255,.25)">
            <div style="font-size:52px;margin-bottom:14px">🇷🇺</div>
            <div style="font-family:'Fredoka One',cursive;font-size:1.4rem;text-align:center;line-height:1.4">${id.ru}</div>
            <div style="font-size:1rem;margin-top:16px;opacity:.9;background:rgba(255,255,255,.15);padding:12px 20px;border-radius:16px;border:1px solid rgba(255,255,255,.2);line-height:1.5">💡 ${id.meaning}</div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:16px;justify-content:center;margin-top:24px">
        <button class="nav-btn" onclick="idiomNav(-1)">◀</button>
        <button class="nav-btn" onclick="idiomNav(1)">▶</button>
      </div>

// ─── ACTIONS ───
function go(screen){S.screen=screen;S.showConf=false;render()}

function selectTheme(i){S.theme=T[i];S.screen='modes';render()}

function selectMode(mode){
  S.screen=mode;S.showConf=false;
  if(mode==='learn'){S.learnIdx=0;S.learnAnim=''}
  if(mode==='phrases'){
    S.phraseItems=shuffle(S.theme.w);S.phraseIdx=0;S.phraseSel=null;
    S.phraseCorrect=0;S.phraseWinCalled=false;
    S.phraseOpts=genOpts(S.phraseItems[0]);
  }
  if(mode==='quiz'){
    S.quizItems=shuffle(S.theme.w);S.quizIdx=0;S.quizSel=null;
    S.quizCorrect=0;S.quizStreak=0;S.quizBest=0;S.quizWinCalled=false;
    S.quizOpts=genOpts(S.quizItems[0]);
  }
  if(mode==='idioms'){S.idiomIdx=0;S.idiomFlipped=false}
  render();
}

function genOpts(w){
  const wrong=shuffle(S.theme.w.filter(x=>x.en!==w.en)).slice(0,2);
  return shuffle([w,...wrong]);
}

function learnNav(d){
  const n=S.learnIdx+d;
  const len=S.theme.w.length;
  S.learnAnim=d>0?'slideInR':'slideInL';
  S.learnIdx=(n+len)%len;
  render();
  setTimeout(()=>{S.learnAnim='';const c=document.getElementById('word-card');if(c)c.style.animation=''},400);
}

function pickPhrase(i){
  if(S.phraseSel)return;
  const w=S.phraseItems[S.phraseIdx];
  const o=S.phraseOpts[i];
  S.phraseSel=o.en;
  const card=document.getElementById('phrase-card');
  if(o.en===w.en){
    playOK();S.phraseCorrect++;S.showConf=true;
    if(card)card.style.animation='correctPop .45s ease';
    setTimeout(()=>{S.showConf=false},2000);
    setTimeout(()=>{
      S.phraseIdx++;S.phraseSel=null;
      if(S.phraseIdx<S.phraseItems.length)S.phraseOpts=genOpts(S.phraseItems[S.phraseIdx]);
      else if(!S.phraseWinCalled){
        S.phraseWinCalled=true;
        S.totalStars+=Math.round((S.phraseCorrect/S.phraseItems.length)*5);
      }
      render();
    },1500);
  }else{
    playFail();
    if(card)card.style.animation='shake .45s ease';
    setTimeout(()=>{S.phraseSel=null;render()},900);
    return;
  }
  render();
}

function pickQuiz(i){
  if(S.quizSel)return;
  const w=S.quizItems[S.quizIdx];
  const o=S.quizOpts[i];
  S.quizSel=o.en;
  const card=document.getElementById('quiz-card');
  if(o.en===w.en){
    playOK();S.quizCorrect++;S.quizStreak++;
    if(S.quizStreak>S.quizBest)S.quizBest=S.quizStreak;
    S.showConf=true;
    if(card)card.style.animation='correctPop .45s ease';
    setTimeout(()=>{S.showConf=false},2000);
    setTimeout(()=>{
      S.quizIdx++;S.quizSel=null;
      if(S.quizIdx<S.quizItems.length)S.quizOpts=genOpts(S.quizItems[S.quizIdx]);
      else if(!S.quizWinCalled){
        S.quizWinCalled=true;
        S.totalStars+=Math.round((S.quizCorrect/S.quizItems.length)*5);
      }
      render();
    },1300);
  }else{
    playFail();S.quizStreak=0;
    if(card)card.style.animation='shake .45s ease';
    setTimeout(()=>{S.quizSel=null;render()},900);
    return;
  }
  render();
}

function idiomNav(d){
  S.idiomIdx=(S.idiomIdx+d+IDIOMS.length)%IDIOMS.length;
  S.idiomFlipped=false;
  render();
}

// ─── MAIN RENDER ───
function render(){
  const app=document.getElementById('app');
  switch(S.screen){
    case 'home':    app.innerHTML=renderHome();break;
    case 'modes':   app.innerHTML=renderModes();break;
    case 'learn':   app.innerHTML=renderLearn();break;
    case 'phrases': app.innerHTML=renderPhrases();break;
    case 'quiz':    app.innerHTML=renderQuiz();break;
    case 'idioms':  app.innerHTML=renderIdioms();break;
    default: app.innerHTML=renderHome();
  }
}

render();
</script>
