<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numbers 1–20 🎈⭐</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:#FFD700; --deep-gold:#FFA500; --pink:#FF6EB4;
    --purple:#9B59FF; --cyan:#00E5FF; --green:#00E676; --coral:#FF6B6B;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Nunito',sans-serif; min-height:100vh; overflow-x:hidden; background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); }

  .bg-gradient {
    position:fixed; inset:0;
    background:linear-gradient(270deg,#ff6eb4,#9b59ff,#00e5ff,#00e676,#ffd700,#ff6b6b,#9b59ff,#ff6eb4);
    background-size:600% 600%; animation:gradientShift 8s ease infinite; opacity:.18; z-index:0;
  }
  @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  .app-wrapper { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; }

  /* ===== COVER ===== */
  #cover { width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px; position:relative; overflow:hidden; }
  .cover-decorations { position:absolute; inset:0; pointer-events:none; }

  .star { position:absolute; animation:floatStar 4s ease-in-out infinite; filter:drop-shadow(0 0 12px #FFD700) drop-shadow(0 0 24px #FFA500); font-size:2.5rem; }
  .star:nth-child(1)  { top:8%;  left:6%;  animation-delay:0s;   font-size:3rem; }
  .star:nth-child(2)  { top:15%; right:8%; animation-delay:.7s;  font-size:2rem; }
  .star:nth-child(3)  { top:55%; left:3%;  animation-delay:1.4s; font-size:2.8rem; }
  .star:nth-child(4)  { top:70%; right:5%; animation-delay:.3s;  font-size:2.2rem; }
  .star:nth-child(5)  { top:35%; left:12%; animation-delay:1.8s; font-size:1.8rem; }
  .star:nth-child(6)  { top:82%; left:18%; animation-delay:.9s;  font-size:3rem; }
  .star:nth-child(7)  { top:25%; right:15%;animation-delay:2.1s; font-size:2.4rem; }
  .star:nth-child(8)  { top:88%; right:12%;animation-delay:1.2s; font-size:2rem; }
  .star:nth-child(9)  { top:45%; right:20%;animation-delay:.5s;  font-size:1.6rem; }
  .star:nth-child(10) { top:62%; left:22%; animation-delay:1.6s; font-size:2.6rem; }
  @keyframes floatStar {
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    25%{transform:translateY(-18px) rotate(15deg) scale(1.15)}
    50%{transform:translateY(-8px) rotate(-10deg) scale(.95)}
    75%{transform:translateY(-22px) rotate(5deg) scale(1.1)}
  }

  .balloon { position:absolute; font-size:3.5rem; animation:floatBalloon 5s ease-in-out infinite; filter:drop-shadow(0 4px 16px rgba(0,0,0,.4)); }
  .balloon:nth-child(11){bottom:15%;left:8%;  animation-delay:0s;}
  .balloon:nth-child(12){bottom:25%;right:7%; animation-delay:1s; font-size:2.8rem;}
  .balloon:nth-child(13){bottom:5%; left:25%; animation-delay:.6s;font-size:4rem;}
  .balloon:nth-child(14){bottom:12%;right:20%;animation-delay:1.5s;font-size:3rem;}
  .balloon:nth-child(15){top:10%;  left:30%; animation-delay:2s; font-size:2.5rem;}
  @keyframes floatBalloon {
    0%,100%{transform:translateY(0) rotate(-8deg)}
    33%{transform:translateY(-25px) rotate(8deg)}
    66%{transform:translateY(-12px) rotate(-4deg)}
  }



  .cover-title {
    font-family:'Fredoka One',cursive; font-size:clamp(3rem,10vw,6rem);
    background:linear-gradient(135deg,#FFD700,#FF6EB4,#00E5FF,#FFD700);
    background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text; animation:titleShine 3s ease infinite; margin-bottom:10px; line-height:1.1;
  }
  @keyframes titleShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

  .cover-subtitle { font-size:clamp(1.1rem,3vw,1.5rem); color:rgba(255,255,255,.8); font-weight:700; margin-bottom:40px; letter-spacing:2px; }

  .cover-numbers { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:44px; max-width:500px; }
  .cover-num { font-family:'Fredoka One',cursive; font-size:1.4rem; width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:12px; animation:numPop .5s ease both; }
  .cover-num:nth-child(1) {background:#FF6B6B;color:white;animation-delay:.05s}
  .cover-num:nth-child(2) {background:#FF9F43;color:white;animation-delay:.10s}
  .cover-num:nth-child(3) {background:#FFD700;color:#333; animation-delay:.15s}
  .cover-num:nth-child(4) {background:#00E676;color:#333; animation-delay:.20s}
  .cover-num:nth-child(5) {background:#00E5FF;color:#333; animation-delay:.25s}
  .cover-num:nth-child(6) {background:#9B59FF;color:white;animation-delay:.30s}
  .cover-num:nth-child(7) {background:#FF6EB4;color:white;animation-delay:.35s}
  .cover-num:nth-child(8) {background:#FF6B6B;color:white;animation-delay:.40s}
  .cover-num:nth-child(9) {background:#FF9F43;color:white;animation-delay:.45s}
  .cover-num:nth-child(10){background:#FFD700;color:#333; animation-delay:.50s}
  .cover-num:nth-child(11){background:#00E676;color:#333; animation-delay:.55s}
  .cover-num:nth-child(12){background:#00E5FF;color:#333; animation-delay:.60s}
  .cover-num:nth-child(13){background:#9B59FF;color:white;animation-delay:.65s}
  .cover-num:nth-child(14){background:#FF6EB4;color:white;animation-delay:.70s}
  .cover-num:nth-child(15){background:#FF6B6B;color:white;animation-delay:.75s}
  .cover-num:nth-child(16){background:#FF9F43;color:white;animation-delay:.80s}
  .cover-num:nth-child(17){background:#FFD700;color:#333; animation-delay:.85s}
  .cover-num:nth-child(18){background:#00E676;color:#333; animation-delay:.90s}
  .cover-num:nth-child(19){background:#00E5FF;color:#333; animation-delay:.95s}
  .cover-num:nth-child(20){background:#9B59FF;color:white;animation-delay:1.0s}
  @keyframes numPop{0%{transform:scale(0) rotate(-20deg);opacity:0}70%{transform:scale(1.2) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}

  .mode-buttons { display:flex; flex-direction:column; gap:16px; width:100%; max-width:380px; }
  .mode-btn {
    padding:20px 32px; border:none; border-radius:22px; font-family:'Fredoka One',cursive;
    font-size:1.65rem; cursor:pointer; transition:all .2s; position:relative; overflow:hidden;
    letter-spacing:.5px; box-shadow:0 6px 22px rgba(0,0,0,.35);
  }
  .mode-btn::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,.15); transform:translateX(-100%); transition:transform .3s; }
  .mode-btn:hover::after{transform:translateX(0)}
  .mode-btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .mode-btn:active{transform:scale(.97)}
  .btn-1{background:linear-gradient(135deg,#FF6EB4,#9B59FF);color:white}
  .btn-2{background:linear-gradient(135deg,#FF9F43,#FFD700);color:#333}
  .btn-3{background:linear-gradient(135deg,#00E5FF,#00E676);color:#333}

  /* ===== GAME ===== */
  #game{display:none;width:100%;min-height:100vh;flex-direction:column;align-items:center;padding:0 16px 40px}
  #game.active{display:flex}

  /* Top bar — prominent centered label, different colour */
  .top-bar {
    width:100%; max-width:600px; display:flex; align-items:center;
    justify-content:space-between; padding:22px 0 14px; gap:14px;
  }
  .back-btn {
    background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.3); color:white;
    padding:10px 20px; border-radius:16px; font-family:'Fredoka One',cursive; font-size:1.15rem;
    cursor:pointer; transition:all .2s; backdrop-filter:blur(8px); white-space:nowrap; flex-shrink:0;
  }
  .back-btn:hover{background:rgba(255,255,255,.25);transform:scale(1.05)}

  /* Mode indicator — vivid, centred, big */
  .mode-indicator {
    font-family:'Fredoka One',cursive;
    font-size:clamp(2.6rem,6vw,3.6rem);
    color:#fff;
    background:linear-gradient(135deg,#7C3AED,#DB2777);
    padding:14px 22px;
    border-radius:18px;
    flex:1;
    text-align:center;
    letter-spacing:.5px;
    box-shadow:0 4px 18px rgba(123,58,237,.5);
    text-shadow:0 2px 8px rgba(0,0,0,.3);
    line-height:1.15;
  }

  .progress-wrap { width:100%; max-width:600px; margin:4px 0 16px; display:flex; align-items:center; gap:12px; }
  .progress-bar{flex:1;height:10px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}
  .progress-fill {
    height:100%; background:linear-gradient(90deg,#FFD700,#FF6EB4,#00E5FF);
    background-size:200% 100%; animation:progressShine 2s linear infinite;
    border-radius:10px; transition:width .5s ease;
  }
  @keyframes progressShine{0%{background-position:0% 0%}100%{background-position:200% 0%}}
  .progress-text{font-family:'Fredoka One',cursive;color:rgba(255,255,255,.8);font-size:.95rem;white-space:nowrap}

  .card {
    width:100%; max-width:480px; background:rgba(255,255,255,.08); backdrop-filter:blur(16px);
    border:2px solid rgba(255,255,255,.18); border-radius:32px; padding:36px 28px 30px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.4); margin-bottom:20px;
    animation:cardIn .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn{0%{opacity:0;transform:scale(.85) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}

  .big-number {
    font-family:'Fredoka One',cursive; font-size:clamp(5rem,20vw,9rem); line-height:1;
    background:linear-gradient(135deg,#FFD700,#FF6EB4); -webkit-background-clip:text;
    -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(0 4px 20px rgba(255,215,0,.4)); cursor:pointer; user-select:none; transition:transform .15s;
  }
  .big-number:hover{transform:scale(1.07)} .big-number:active{transform:scale(.95)}

  .speak-btn {
    background:linear-gradient(135deg,#00C9A7,#00E5FF); border:none; border-radius:50%;
    width:60px;height:60px;font-size:1.8rem;cursor:pointer;box-shadow:0 6px 20px rgba(0,229,200,.5);
    transition:all .2s;display:flex;align-items:center;justify-content:center;
  }
  .speak-btn:hover{transform:scale(1.12);box-shadow:0 8px 28px rgba(0,229,200,.75)}
  .speak-btn:active{transform:scale(.9)}
  .speak-btn.speaking{animation:speakPulse .5s ease infinite alternate}
  @keyframes speakPulse{0%{box-shadow:0 6px 20px rgba(0,229,200,.5)}100%{box-shadow:0 6px 40px rgba(0,229,200,.95);transform:scale(1.12)}}

  .word-name{font-family:'Fredoka One',cursive;font-size:clamp(2rem,7vw,3.5rem);color:white;text-shadow:0 2px 12px rgba(0,0,0,.4);letter-spacing:1px;text-align:center;text-transform:capitalize}
  .phrase-wrap{text-align:center}
  .emoji-row{font-size:clamp(1.8rem,6vw,3rem);line-height:1.4;margin-bottom:6px;min-height:60px;word-break:break-word}
  .phrase-en{font-family:'Fredoka One',cursive;font-size:clamp(1.3rem,4vw,2rem);color:var(--gold);text-shadow:0 0 16px rgba(255,215,0,.5);margin-bottom:4px}
  .phrase-ru{font-size:1.1rem;color:rgba(255,255,255,.75);font-weight:600}
  .example-wrap{text-align:center}
  .example-expr{font-family:'Fredoka One',cursive;font-size:clamp(2rem,7vw,3.5rem);color:var(--cyan);text-shadow:0 0 20px rgba(0,229,255,.5);margin-bottom:10px}
  .example-result{font-family:'Fredoka One',cursive;font-size:clamp(3rem,10vw,6rem);background:linear-gradient(135deg,#00E676,#00E5FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}

  .nav-row{display:flex;gap:14px;margin-top:4px}
  .nav-btn{border:none;border-radius:18px;padding:14px 32px;font-family:'Fredoka One',cursive;font-size:1.2rem;cursor:pointer;transition:all .2s;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .nav-btn.prev{background:linear-gradient(135deg,#FF6B6B,#FF9F43);color:white}
  .nav-btn.next{background:linear-gradient(135deg,#FF9F43,#FFD700);color:#222}
  .nav-btn:hover{transform:scale(1.06)} .nav-btn:active{transform:scale(.94)}

  .dots-wrap{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:320px;margin-top:8px}
  .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .2s}
  .dot.active{background:var(--gold);box-shadow:0 0 8px var(--gold);transform:scale(1.3)}
  .dot.done{background:var(--green)}

  /* ===== FIREWORKS / SALUTE ===== */
  #fireworks-overlay {
    position:fixed; inset:0; pointer-events:none; z-index:9999;
    display:none;
  }
  #fireworks-overlay.active { display:block; }

  .fw-particle {
    position:absolute;
    border-radius:50%;
    animation:fwFly var(--dur) ease-out both;
  }
  @keyframes fwFly {
    0%  { transform:translate(0,0) scale(1);   opacity:1; }
    80% { opacity:1; }
    100%{ transform:translate(var(--tx),var(--ty)) scale(0); opacity:0; }
  }

  /* Celebration screen */
  #celebration {
    display:none;
    position:fixed; inset:0; z-index:8888;
    background:rgba(10,5,30,.88);
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px;
    backdrop-filter:blur(6px);
  }
  #celebration.active { display:flex; }

  .celeb-emoji { font-size:5rem; animation:celebBounce .6s ease infinite alternate; }
  @keyframes celebBounce{0%{transform:scale(1)}100%{transform:scale(1.18)}}

  .celeb-title {
    font-family:'Fredoka One',cursive; font-size:clamp(2.4rem,8vw,4.5rem);
    background:linear-gradient(135deg,#FFD700,#FF6EB4,#00E5FF,#FFD700);
    background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text; animation:titleShine 2s ease infinite; margin:16px 0 8px;
  }
  .celeb-sub { font-size:1.3rem; color:rgba(255,255,255,.85); font-weight:700; margin-bottom:32px; }

  .celeb-btn {
    background:linear-gradient(135deg,#FFD700,#FF9F43); color:#222;
    border:none; border-radius:20px; padding:16px 36px;
    font-family:'Fredoka One',cursive; font-size:1.5rem; cursor:pointer;
    box-shadow:0 6px 24px rgba(255,165,0,.5); transition:all .2s;
    margin:8px;
  }
  .celeb-btn:hover{transform:scale(1.06);box-shadow:0 10px 30px rgba(255,165,0,.7)}
  .celeb-btn.secondary{background:rgba(255,255,255,.15);color:white;box-shadow:none;border:2px solid rgba(255,255,255,.3)}

  .sparkle-particle{position:fixed;width:10px;height:10px;border-radius:50%;animation:sparkleFly .8s ease both}
  @keyframes sparkleFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}

  @media(max-width:480px){
    .nav-btn{padding:12px 22px;font-size:1.05rem}
    .card{padding:28px 18px 22px}
    .mode-btn{font-size:1.35rem;padding:17px 24px}
    .mode-indicator{font-size:1.15rem;padding:10px 14px}
  }
</style>
</head>
<body>
<div class="bg-gradient"></div>

<!-- Fireworks canvas layer -->
<div id="fireworks-overlay"></div>

<!-- Celebration modal -->
<div id="celebration">
  <div class="celeb-emoji">🎉</div>
  <div class="celeb-title" id="celebTitle">Отлично!</div>
  <div class="celeb-sub" id="celebSub">Все 20 карточек пройдены!</div>
  <button class="celeb-btn" onclick="celebAgain()">🔄 Ещё раз</button>
  <button class="celeb-btn secondary" onclick="celebHome()">🏠 На главную</button>
</div>

<div class="app-wrapper">
  <!-- COVER -->
  <div id="cover">
    <div class="cover-decorations">
      <!-- 10 stars -->
      <span class="star">⭐</span><span class="star">✨</span><span class="star">⭐</span>
      <span class="star">✨</span><span class="star">⭐</span><span class="star">✨</span>
      <span class="star">⭐</span><span class="star">✨</span><span class="star">⭐</span><span class="star">✨</span>
      <!-- 5 balloons -->
      <span class="balloon">🎈</span><span class="balloon">🎈</span><span class="balloon">🎈</span>
      <span class="balloon">🎈</span><span class="balloon">🎈</span>

    </div>

    <div class="cover-title">Numbers<br>1 – 20</div>
    <div class="cover-subtitle">🇬🇧 Учим цифры на английском</div>

    <div class="cover-numbers">
      <div class="cover-num">1</div><div class="cover-num">2</div><div class="cover-num">3</div>
      <div class="cover-num">4</div><div class="cover-num">5</div><div class="cover-num">6</div>
      <div class="cover-num">7</div><div class="cover-num">8</div><div class="cover-num">9</div>
      <div class="cover-num">10</div><div class="cover-num">11</div><div class="cover-num">12</div>
      <div class="cover-num">13</div><div class="cover-num">14</div><div class="cover-num">15</div>
      <div class="cover-num">16</div><div class="cover-num">17</div><div class="cover-num">18</div>
      <div class="cover-num">19</div><div class="cover-num">20</div>
    </div>

    <div class="mode-buttons">
      <button class="mode-btn btn-1" onclick="startMode(1)">🔤 Названия цифр</button>
      <button class="mode-btn btn-2" onclick="startMode(2)">🎒 Цифры со словами</button>
      <button class="mode-btn btn-3" onclick="startMode(3)">➕ Примеры</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="game">
    <div class="top-bar">
      <button class="back-btn" onclick="goBack()">← Назад</button>
      <div class="mode-indicator" id="modeLabel">Названия цифр</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:5%"></div></div>
      <div class="progress-text" id="progressText">1 / 20</div>
    </div>

    <div class="card" id="mainCard"></div>

    <div class="nav-row">
      <button class="nav-btn prev" onclick="navigate(-1)">◀ Назад</button>
      <button class="nav-btn next" id="nextBtn" onclick="navigate(1)">Вперёд ▶</button>
    </div>

    <div class="dots-wrap" id="dotsWrap"></div>
  </div>
</div>

<script>
const numbers = [
  {n:1, word:'one',      phrase:'one apple',        emoji:'🍎',                                                                                        ru:'одно яблоко'},
  {n:2, word:'two',      phrase:'two cats',         emoji:'🐱🐱',                                                                                      ru:'два кота'},
  {n:3, word:'three',    phrase:'three stars',      emoji:'⭐⭐⭐',                                                                                     ru:'три звезды'},
  {n:4, word:'four',     phrase:'four books',       emoji:'📚📚📚📚',                                                                                  ru:'четыре книги'},
  {n:5, word:'five',     phrase:'five flowers',     emoji:'🌸🌸🌸🌸🌸',                                                                                ru:'пять цветков'},
  {n:6, word:'six',      phrase:'six birds',        emoji:'🐦🐦🐦🐦🐦🐦',                                                                             ru:'шесть птиц'},
  {n:7, word:'seven',    phrase:'seven balls',      emoji:'⚽⚽⚽⚽⚽⚽⚽',                                                                            ru:'семь мячей'},
  {n:8, word:'eight',    phrase:'eight dogs',       emoji:'🐶🐶🐶🐶🐶🐶🐶🐶',                                                                         ru:'восемь собак'},
  {n:9, word:'nine',     phrase:'nine snakes',      emoji:'🐍🐍🐍🐍🐍🐍🐍🐍🐍',                                                                       ru:'девять змей'},
  {n:10,word:'ten',      phrase:'ten caps',         emoji:'🧢🧢🧢🧢🧢🧢🧢🧢🧢🧢',                                                                    ru:'десять кепок'},
  {n:11,word:'eleven',   phrase:'eleven trees',     emoji:'🌳🌳🌳🌳🌳🌳🌳🌳🌳🌳🌳',                                                                   ru:'одиннадцать деревьев'},
  {n:12,word:'twelve',   phrase:'twelve eggs',      emoji:'🥚🥚🥚🥚🥚🥚🥚🥚🥚🥚🥚🥚',                                                                ru:'двенадцать яиц'},
  {n:13,word:'thirteen', phrase:'thirteen coins',   emoji:'🪙🪙🪙🪙🪙🪙🪙🪙🪙🪙🪙🪙🪙',                                                             ru:'тринадцать монет'},
  {n:14,word:'fourteen', phrase:'fourteen cups',    emoji:'☕☕☕☕☕☕☕☕☕☕☕☕☕☕',                                                           ru:'четырнадцать чашек'},
  {n:15,word:'fifteen',  phrase:'fifteen horses',   emoji:'🐴🐴🐴🐴🐴🐴🐴🐴🐴🐴🐴🐴🐴🐴🐴',                                                         ru:'пятнадцать лошадей'},
  {n:16,word:'sixteen',  phrase:'sixteen bees',     emoji:'🐝🐝🐝🐝🐝🐝🐝🐝🐝🐝🐝🐝🐝🐝🐝🐝',                                                      ru:'шестнадцать пчёл'},
  {n:17,word:'seventeen',phrase:'seventeen drops',  emoji:'💧💧💧💧💧💧💧💧💧💧💧💧💧💧💧💧💧',                                                   ru:'семнадцать капель'},
  {n:18,word:'eighteen', phrase:'eighteen keys',    emoji:'🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑🔑',                                                ru:'восемнадцать ключей'},
  {n:19,word:'nineteen', phrase:'nineteen moons',   emoji:'🌙🌙🌙🌙🌙🌙🌙🌙🌙🌙🌙🌙🌙🌙🌙🌙🌙🌙🌙',                                             ru:'девятнадцать лун'},
  {n:20,word:'twenty',   phrase:'twenty flags',     emoji:'🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺🇷🇺',                                          ru:'двадцать флагов'}
];

const examples = [
  {a:1,b:1},{a:2,b:1},{a:1,b:2},{a:3,b:1},{a:2,b:2},
  {a:4,b:2},{a:5,b:3},{a:6,b:4},{a:7,b:3},{a:8,b:2},
  {a:9,b:1},{a:6,b:6},{a:7,b:6},{a:8,b:5},{a:9,b:4},
  {a:10,b:5},{a:11,b:4},{a:12,b:6},{a:13,b:6},{a:14,b:6}
];

const modeLabels  = ['','Названия цифр','Цифры со словами','Примеры'];
const celebTitles = ['','🌟 Молодец!','🎊 Браво!','🏆 Отлично!'];
const celebSubs   = ['','Все цифры выучены!','Все слова пройдены!','Все примеры решены!'];

let currentMode = 1, currentIndex = 0;
const done = new Set();

function startMode(m){
  currentMode = m; currentIndex = 0; done.clear();
  document.getElementById('cover').style.display = 'none';
  document.getElementById('game').classList.add('active');
  document.getElementById('modeLabel').textContent = modeLabels[m];
  document.getElementById('nextBtn').textContent = 'Вперёд ▶';
  buildDots(); renderCard();
}

function goBack(){
  window.speechSynthesis.cancel();
  document.getElementById('game').classList.remove('active');
  document.getElementById('cover').style.display = 'flex';
}

function buildDots(){
  const wrap = document.getElementById('dotsWrap'); wrap.innerHTML = '';
  for(let i=0;i<20;i++){
    const d=document.createElement('div'); d.className='dot';
    d.onclick=()=>{currentIndex=i;renderCard();};
    wrap.appendChild(d);
  }
}

function updateDots(){
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.classList.toggle('active', i===currentIndex);
    d.classList.toggle('done', done.has(i) && i!==currentIndex);
  });
}

function updateProgress(){
  document.getElementById('progressFill').style.width = ((currentIndex+1)/20*100)+'%';
  document.getElementById('progressText').textContent = `${currentIndex+1} / 20`;
  // last card
  document.getElementById('nextBtn').textContent =
    currentIndex === 19 ? '✅ Готово!' : 'Вперёд ▶';
}

function renderCard(){
  const card = document.getElementById('mainCard');
  card.style.animation='none'; card.offsetHeight;
  card.style.animation='cardIn .4s cubic-bezier(.34,1.56,.64,1) both';

  const d = numbers[currentIndex];
  const ex = examples[currentIndex];
  let html = '';

  if(currentMode===1){
    html=`
      <div class="big-number" onclick="speakPhrase('${d.word}')">${d.n}</div>
      <button class="speak-btn" id="speakBtn" onclick="speakPhrase('${d.word}')">🔊</button>
      <div class="word-name">${d.word}</div>`;
  } else if(currentMode===2){
    html=`
      <div class="big-number" onclick="speakPhrase('${d.phrase}')">${d.n}</div>
      <button class="speak-btn" id="speakBtn" onclick="speakPhrase('${d.phrase}')">🔊</button>
      <div class="phrase-wrap">
        <div class="emoji-row">${d.emoji}</div>
        <div class="phrase-en">${d.phrase}</div>
        <div class="phrase-ru">${d.ru}</div>
      </div>`;
  } else {
    const res=ex.a+ex.b;
    const aW=numbers[ex.a-1].word, bW=numbers[ex.b-1].word, rW=numbers[res-1].word;
    const spoken=`${aW} plus ${bW} equals ${rW}`;
    html=`
      <div class="example-wrap">
        <div class="example-expr">${ex.a} + ${ex.b} = ?</div>
        <div class="example-result">${res}</div>
        <div class="word-name">${rW}</div>
        <div class="phrase-ru" style="margin-top:8px">${aW} + ${bW} = ${rW}</div>
      </div>
      <button class="speak-btn" id="speakBtn" onclick="speakPhrase('${spoken}')">🔊</button>`;
  }

  card.innerHTML = html;
  done.add(currentIndex);
  updateDots(); updateProgress();
}

function navigate(dir){
  if(dir===1 && currentIndex===19){
    // MODE COMPLETE → launch salute then show celebration
    launchFireworks(()=>{
      document.getElementById('celebTitle').textContent = celebTitles[currentMode];
      document.getElementById('celebSub').textContent   = celebSubs[currentMode];
      document.getElementById('celebration').classList.add('active');
    });
    return;
  }
  currentIndex = (currentIndex + dir + 20) % 20;
  renderCard();
}

function celebAgain(){
  document.getElementById('celebration').classList.remove('active');
  currentIndex=0; done.clear(); buildDots(); renderCard();
}
function celebHome(){
  document.getElementById('celebration').classList.remove('active');
  goBack();
}

/* ====== FIREWORKS ====== */
function launchFireworks(onDone){
  const overlay = document.getElementById('fireworks-overlay');
  overlay.classList.add('active');
  overlay.innerHTML = '';

  const W = window.innerWidth, H = window.innerHeight;
  const colors = ['#FFD700','#FF6EB4','#00E5FF','#9B59FF','#00E676','#FF9F43','#FF6B6B','#ffffff','#FF4500','#39FF14'];
  const shapes = ['●','★','✦','♥','◆'];

  let burst = 0;
  function fireBurst(){
    if(burst >= 14){ // 14 bursts over ~3.5s
      setTimeout(()=>{
        overlay.classList.remove('active');
        overlay.innerHTML = '';
        if(onDone) onDone();
      }, 800);
      return;
    }
    burst++;
    const cx = W * (0.15 + Math.random() * 0.7);
    const cy = H * (0.08 + Math.random() * 0.55);
    const count = 28 + Math.floor(Math.random()*18);
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'fw-particle';
      const angle = (i/count)*Math.PI*2 + (Math.random()-.5)*.4;
      const dist  = 80 + Math.random()*160;
      const dur   = (0.8 + Math.random()*0.7).toFixed(2)+'s';
      const col   = colors[Math.floor(Math.random()*colors.length)];
      const size  = 6 + Math.floor(Math.random()*8);
      p.style.cssText = `
        left:${cx}px; top:${cy}px; width:${size}px; height:${size}px;
        background:${col};
        box-shadow:0 0 ${size*2}px ${col};
        --tx:${(Math.cos(angle)*dist).toFixed(1)}px;
        --ty:${(Math.sin(angle)*dist).toFixed(1)}px;
        --dur:${dur};
      `;
      overlay.appendChild(p);
      setTimeout(()=>p.remove(), 1600);
    }
    // Also drop some emoji sparks
    const em = ['⭐','✨','💥','🌟','🎆'];
    for(let j=0;j<5;j++){
      const sp = document.createElement('div');
      sp.style.cssText = `
        position:absolute; left:${cx+(Math.random()-.5)*60}px; top:${cy+(Math.random()-.5)*60}px;
        font-size:${1.2+Math.random()*1.4}rem; animation:fwFly ${(.9+Math.random()*.5).toFixed(2)}s ease-out both;
        --tx:${((Math.random()-.5)*200).toFixed(1)}px;
        --ty:${((Math.random()-.5)*200).toFixed(1)}px;
        --dur:${(.9+Math.random()*.5).toFixed(2)}s;
        pointer-events:none;
      `;
      sp.textContent = em[Math.floor(Math.random()*em.length)];
      overlay.appendChild(sp);
      setTimeout(()=>sp.remove(), 1800);
    }
  }

  // Fire bursts with staggered timing
  for(let k=0;k<14;k++){
    setTimeout(fireBurst, k*240);
  }
}

/* ====== SPEECH ====== */
function speakPhrase(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const btn = document.getElementById('speakBtn');
  if(btn) btn.classList.add('speaking');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang='en-GB'; utter.rate=.85; utter.pitch=1.1;
  const voices = speechSynthesis.getVoices();
  const brit = voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));
  if(brit) utter.voice=brit;
  utter.onend =()=>{ if(btn) btn.classList.remove('speaking'); };
  utter.onerror=()=>{ if(btn) btn.classList.remove('speaking'); };
  speechSynthesis.speak(utter);
  spawnSparkles();
}
speechSynthesis.onvoiceschanged = ()=>speechSynthesis.getVoices();

/* ====== SPARKLES ====== */
function spawnSparkles(){
  const colors=['#FFD700','#FF6EB4','#00E5FF','#9B59FF','#00E676','#FF9F43'];
  const x=window.innerWidth/2, y=window.innerHeight/2;
  for(let i=0;i<12;i++){
    const p=document.createElement('div'); p.className='sparkle-particle';
    const angle=(i/12)*Math.PI*2, dist=60+Math.random()*80;
    p.style.cssText=`left:${x}px;top:${y}px;background:${colors[i%colors.length]};
      --tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;
      box-shadow:0 0 6px ${colors[i%colors.length]};`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),850);
  }
}
