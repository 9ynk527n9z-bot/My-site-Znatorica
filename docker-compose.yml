services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: znatorika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: znatorika
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # доступен только с самого сервера, не наружу
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U znatorika"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000" # наружу отдаёт Nginx, а не контейнер напрямую
    command: >
      sh -c "npx prisma@5.22.0 migrate deploy && (node prisma/seed-content.mjs || echo '[seed-content] пропущено из-за ошибки, сайт продолжает запуск') && node server.js"

volumes:
  pgdata:
