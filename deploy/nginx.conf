# Конфиг Nginx для znatorica.ru
# Разместить в /etc/nginx/sites-available/znatorika и создать симлинк в sites-enabled
# SSL-сертификат выпускается отдельно через certbot (см. deploy/README.md)

server {
    listen 80;
    server_name znatorica.ru www.znatorica.ru 62.217.181.114;

    # certbot сам добавит сюда блок для проверки домена и редиректа на https

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 10M;
}
