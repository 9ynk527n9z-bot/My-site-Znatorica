# Конфиг Nginx для znatorica.ru
# Разместить в /etc/nginx/sites-available/znatorika и создать симлинк в sites-enabled
# SSL-сертификат выпускается отдельно через certbot (см. deploy/README.md)

# www → без www, постоянный редирект.
# Раньше оба хоста отдавали один и тот же контент с кодом 200, и поисковик
# видел две копии каждой страницы. Тег canonical в HTML это лишь подсказка,
# а 301 — однозначная команда склеить адреса. Блок отдельный и со своими
# сертификатами: TLS-соединение устанавливается до того, как сервер сможет
# ответить редиректом, поэтому без ssl_certificate здесь была бы ошибка сертификата.
server {
    server_name www.znatorica.ru;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/znatorica.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/znatorica.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://znatorica.ru$request_uri;
}

server {
    server_name znatorica.ru 62.217.181.114;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 10M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/znatorica.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/znatorica.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    # http → https. Для www сразу указываем финальный адрес без www,
    # чтобы браузер и краулер шли одним редиректом, а не двумя.
    if ($host = www.znatorica.ru) {
        return 301 https://znatorica.ru$request_uri;
    }

    if ($host = znatorica.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name znatorica.ru www.znatorica.ru 62.217.181.114;
    return 404; # managed by Certbot
}
